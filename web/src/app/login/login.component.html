<div class="auth-page">
  <div class="auth-card">

    <span class="logo">T3N NEXUS</span>

    <h1 class="auth-title">Chào mừng trở lại</h1>
    <p class="auth-subtitle">Đăng nhập để tiếp tục mua sắm</p>

    <button mat-flat-button class="submit-btn" (click)="login()">Đăng nhập</button>

    <p class="auth-switch">
      Chưa có tài khoản? <a routerLink="/register">Đăng ký</a>
    </p>

  </div>
</div>
