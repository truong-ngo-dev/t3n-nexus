  # ---- Sản phẩm và biến thể của người bán (Đã làm, feature 07) ----
  /api/seller/products:
    get:
      summary: Sản phẩm của tôi (danh sách)
      description: |
        **Đã làm (feature 07).** Chỉ sản phẩm của người gọi, mới nhất trước. Kèm số biến thể và khoảng giá để hiển thị trang danh sách. Không ghi, không khóa dòng.
      operationId: listMyProducts
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
    post:
      summary: Tạo sản phẩm nháp
      description: |
        **Đã làm (feature 07).** Vai `USER`; chủ lấy từ token. Sản phẩm luôn ở `DRAFT`; trạng thái, `version`, `sellerId` trong nội dung bị bỏ qua.
        Danh mục phải là lá và dùng được (chính nó và mọi tổ tiên đang dùng); thương hiệu tùy chọn, nếu có phải đang dùng.
        `attributes`: dòng có `axis: true` là trục biến thể (kiểu chọn một, tối đa 2); thuộc tính bắt buộc đã làm trục coi như đã điền. Chưa kiểm "người bán đã duyệt" (feature 09).
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: |
            `CATALOG_FIELD_INVALID` (tiêu đề ngoài 5-200, mô tả quá 5.000); `PRODUCT_ATTRIBUTE_INVALID` (kèm tên thuộc tính: ngoài tập tùy chọn, sai kiểu, ngoài ràng buộc riêng, không được gán cho danh mục);
            `PRODUCT_AXIS_INVALID` (quá 2 trục, trục không phải chọn một, trục không có giá trị)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `CATALOG_ROLE_NOT_ALLOWED` (vai không phải `USER`), `SELLER_NOT_APPROVED` (người bán chưa có bản sao trạng thái hoặc chưa được duyệt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`CATEGORY_NOT_FOUND`, `BRAND_NOT_FOUND`, `ATTRIBUTE_TEMPLATE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`PRODUCT_CATEGORY_NOT_USABLE` (không phải lá hoặc ngừng dùng hoặc có tổ tiên ngừng dùng), `PRODUCT_BRAND_NOT_USABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}:
    get:
      summary: Chi tiết sản phẩm của tôi
      description: |
        **Đã làm (feature 07).** Đủ thông tin, thuộc tính (kể cả trục), biến thể, và **điều kiện còn thiếu để đăng** (`RM-CAT-04`). Ở feature 07 có hai điều kiện:
        `REQUIRED_ATTRIBUTE_MISSING` (kèm tên thuộc tính), `NO_ACTIVE_VARIANT`; ảnh (08) và người bán đã duyệt (09) thêm sau.
        Sản phẩm không có hoặc của người khác: cùng 404 `PRODUCT_NOT_FOUND`, không lộ sự tồn tại.
      operationId: getMyProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    patch:
      summary: Sửa sản phẩm
      description: |
        **Đã làm (feature 07).** `PATCH`: trường vắng giữ nguyên. Nếu gửi `attributes` thì thay **toàn bộ** danh sách thuộc tính (kể cả trục) và lệnh khóa dòng sản phẩm; giá trị đã lưu và không đổi được miễn kiểm lại.
        Khi đã có biến thể: tập thuộc tính làm trục phải giữ nguyên, chỉ thêm hoặc bớt giá trị trục, và không bớt giá trị đang được biến thể dùng (kể cả biến thể đã ngừng).
        Danh mục không đổi sau khi tạo. `version` tăng; không gửi `version`.
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Sản phẩm sau thay đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: '`CATALOG_FIELD_INVALID`, `PRODUCT_ATTRIBUTE_INVALID`, `PRODUCT_AXIS_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: |
            `PRODUCT_AXES_LOCKED` (đã có biến thể mà đổi tập mẫu làm trục), `PRODUCT_AXIS_VALUE_IN_USE` (bớt giá trị trục đang được biến thể dùng),
            `PRODUCT_BRAND_NOT_USABLE`, `CONCURRENT_UPDATE` (người khác hoặc một lệnh biến thể vừa đổi sản phẩm; tải lại rồi thử lại)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      delete:
        summary: Xóa nháp sản phẩm
        description: |
          **Đã làm (feature 09).** Khóa dòng sản phẩm; chỉ nháp chưa từng đăng; xóa cả biến thể, ảnh, thuộc tính; không ra sự kiện.
        operationId: deleteDraftProduct
        parameters:
          - $ref: '#/components/parameters/Id'
        responses:
          '200':
            description: Đã xóa thành công (không nội dung)
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/SellerRoleRequired'
          '404':
            $ref: '#/components/responses/ProductNotFound'
          '409':
            description: '`PRODUCT_NOT_DELETABLE`: đã từng đăng hoặc đang đăng'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Xóa nháp chưa từng đăng
      description: |
        **Đã làm (feature 09).** Chỉ sản phẩm `DRAFT` chưa từng đăng (chưa có `publishedAt`). Khóa dòng sản phẩm; xóa biến thể, ảnh, thuộc tính
        của sản phẩm; sau khi giao dịch xong thì hủy các đối tượng ảnh trên kho (nỗ lực tốt nhất). Không ra sự kiện (nháp chưa từng hiển thị).
      operationId: deleteDraftProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`PRODUCT_NOT_DELETABLE`: sản phẩm đã từng đăng hoặc đang đăng'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}/publish:
    post:
      summary: Đăng sản phẩm
      description: |
        **Đã làm (feature 09).** Khóa dòng sản phẩm; từ `DRAFT` hoặc `UNPUBLISHED` (đăng lại kiểm lại toàn bộ điều kiện); `publishedAt` đặt ở lần đầu và không đổi; `version` tăng; ra `EVT-CAT-01` và `EVT-CAT-02` cho mọi biến thể (cùng giao dịch).
      operationId: publishProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chi tiết sản phẩm sau khi đăng (trạng thái `PUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: |
            `CATALOG_INVALID_STATE`: đang `PUBLISHED`; `PRODUCT_NOT_PUBLISHABLE`: thiếu điều kiện, mảng `errors` của phản hồi chứa MỌI điều kiện thiếu dạng `MÃ` hoặc `MÃ:templateId`, mã thuộc `REQUIRED_ATTRIBUTE_MISSING`, `NO_ACTIVE_VARIANT`, `NO_IMAGE`, `SELLER_NOT_APPROVED`, `CATEGORY_NOT_USABLE`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}/unpublish:
    post:
      summary: Gỡ sản phẩm
      description: |
        **Đã làm (feature 09).** Khóa dòng sản phẩm; ra sự kiện `visible=false`; sửa khi đã gỡ không ra sự kiện.
      operationId: unpublishProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chi tiết sản phẩm sau khi gỡ (trạng thái `UNPUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`CATALOG_INVALID_STATE`: sản phẩm không ở trạng thái `PUBLISHED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}/variants:
    post:
      summary: Thêm biến thể
      description: |
        **Đã làm (feature 07).** Khóa dòng sản phẩm: lệnh của cùng một sản phẩm xếp hàng, không bị từ chối vì đua nhau. `combination`: đúng một mã tùy chọn cho mỗi trục, nằm trong tập giá trị của trục.
        Sản phẩm không có trục: tổ hợp rỗng (biến thể mặc định), chỉ một. Không có đường sửa tổ hợp hay xóa biến thể. `version` sản phẩm tăng đúng một.
