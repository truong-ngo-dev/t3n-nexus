                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CATALOG_ROLE_NOT_ALLOWED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PRODUCT_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`IMAGE_LIMIT_REACHED`, `UPLOAD_PENDING_LIMIT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`UPLOAD_STORAGE_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}/images:
    post:
      summary: Xác nhận ảnh đã tải lên
      description: |
        **Đã làm (feature 08).** Xác nhận kiểm tệp thật (có tồn tại, dung lượng, chữ ký JPEG/PNG/WebP khớp loại đã khai); khóa dòng sản phẩm; `version` sản phẩm tăng.
      operationId: confirmImage
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmImageRequest'
      responses:
        '201':
          description: Ảnh vừa gắn vào sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CATALOG_ROLE_NOT_ALLOWED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PRODUCT_NOT_FOUND`, `UPLOAD_SLOT_NOT_FOUND` (chỗ không có, của người khác, của sản phẩm khác hoặc đã dùng)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`UPLOAD_SLOT_EXPIRED`, `IMAGE_LIMIT_REACHED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`UPLOAD_NOT_COMPLETED`, `UPLOAD_CONTENT_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`UPLOAD_STORAGE_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}/images/order:
    put:
      summary: Sắp xếp lại thứ tự ảnh
      description: |
        **Đã làm (feature 08).** Cùng thứ tự thì không đổi gì và không tăng `version`.
      operationId: reorderImages
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderImagesRequest'
      responses:
        '200':
          description: Danh sách ảnh theo thứ tự mới
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductImage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CATALOG_ROLE_NOT_ALLOWED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PRODUCT_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`IMAGE_ORDER_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/seller/products/{id}/images/{imageId}:
    delete:
      summary: Bỏ ảnh khỏi sản phẩm
      description: |
        **Đã làm (feature 08).** Xóa đối tượng trên kho sau khi giao dịch xong, lỗi xóa không làm lệnh thất bại.
      operationId: removeImage
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Danh sách ảnh còn lại sau khi bỏ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductImage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CATALOG_ROLE_NOT_ALLOWED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`PRODUCT_NOT_FOUND`, `IMAGE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    ValidationError:
      description: |
        Dữ liệu sai. `code` là `CATALOG_FIELD_INVALID` (nêu tên trường: tên rỗng, quá 100 ký tự hoặc sai dạng mã, gợi ý quá 200, đơn vị quá 20 hoặc đặt cho mẫu không phải `NUMBER`, danh sách rỗng...).
        Thông báo chỉ nêu tên trường, không nêu giá trị. Mã sai định dạng UUID ở đường dẫn: 400 `INVALID_PARAMETER`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Không có token, token hết hạn hoặc sai chữ ký
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRoleRequired:
      description: Vai không phải `ADMIN` (`CATALOG_ROLE_NOT_ALLOWED`); quy tắc nghiệp vụ của use case, không đọc hay ghi kho
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SellerRoleRequired:
      description: Vai không phải `USER` (`CATALOG_ROLE_NOT_ALLOWED`, kể cả `ADMIN`); quy tắc nghiệp vụ của use case, không đọc hay ghi kho. **Đã làm (feature 07).**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProductNotFound:
      description: '`PRODUCT_NOT_FOUND` (sản phẩm không có hoặc của người khác, cùng một mã) hoặc `VARIANT_NOT_FOUND` (biến thể không có hoặc thuộc sản phẩm khác). **Đã làm (feature 07).**'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không có thực thể (`CATEGORY_NOT_FOUND`, `ATTRIBUTE_TEMPLATE_NOT_FOUND`, `ATTRIBUTE_OPTION_NOT_FOUND`, `BRAND_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StateConflict:
      description: |
        - `CATALOG_INVALID_STATE`: đã ở trạng thái đó (ngừng cái đã ngừng, bật cái đang dùng); không ghi kiểm toán, không event
        - `CONCURRENT_UPDATE`: người khác vừa sửa; tải lại rồi thử lại
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Status:
      type: string
      enum: [ACTIVE, INACTIVE]
    InputType:
      type: string
      enum: [SINGLE_SELECT, MULTI_SELECT, TEXT, NUMBER, BOOLEAN, DATE]
    CategoryTreeNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
          enum: [1, 2, 3]
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTreeNode'
    AdminCategoryNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
          enum: [1, 2, 3]
        sortOrder:
          type: integer
        status:
          $ref: '#/components/schemas/Status'
        usable:
          type: boolean
          description: Chính nó và mọi tổ tiên đang dùng (INV-CAT-97)
        version:
          type: integer
          format: int64
        children:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategoryNode'
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        level:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer
        status:
          $ref: '#/components/schemas/Status'
        version:
          type: integer
          format: int64
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: string
          format: uuid
          nullable: true
    RenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ReorderCategoriesRequest:
      type: object
      required: [categoryIds]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Rỗng là các danh mục gốc
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
    Constraints:
      type: object
      description: |
        Ràng buộc riêng theo danh mục, khai báo khi gán mẫu cho danh mục lá (xem `data.md` mục 6); mẫu chỉ kiểm định dạng chung theo kiểu nhập. Chỉ trường thuộc kiểu nhập của mẫu được đặt; trường khác bị từ chối
        (`ATTRIBUTE_CONSTRAINTS_INVALID`). `{}` hoặc vắng là không ràng buộc.
      properties:
        maxLength:
          type: integer
          description: '`TEXT`'
        min:
          type: number
          description: '`NUMBER`'
        max:
          type: number
          description: '`NUMBER`'
        integerOnly:
          type: boolean
          description: '`NUMBER`'
        maxSelections:
          type: integer
          description: '`MULTI_SELECT`'
        inputPrecision:
          type: string
          enum: [YEAR, MONTH, DAY]
          description: '`DATE`'
        minDate:
          type: string
          description: '`DATE`'
        maxDate:
          type: string
          description: '`DATE`'
    AssignmentItem:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: string
          format: uuid
        required:
          type: boolean
          default: false
        displayOrder:
          type: integer
          default: 0
        constraints:
          $ref: '#/components/schemas/Constraints'
    ReplaceAssignmentsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Danh sách mong muốn cuối cùng; có thể rỗng (bỏ hết)
          items:
            $ref: '#/components/schemas/AssignmentItem'
    AdminAssignment:
      type: object
      properties:
        templateId:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        inputType:
          $ref: '#/components/schemas/InputType'
        templateStatus:
          $ref: '#/components/schemas/Status'
        usable:
          type: boolean
        required:
          type: boolean
        displayOrder:
          type: integer
        constraints:
          $ref: '#/components/schemas/Constraints'
    CategoryAttribute:
      type: object
      description: Thuộc tính người bán dùng ở một danh mục lá (chỉ mẫu dùng được, chỉ tùy chọn đang dùng)
      properties:
        templateId:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        hint:
          type: string
          nullable: true
        inputType:
          $ref: '#/components/schemas/InputType'
        unit:
          type: string
          nullable: true
        required:
          type: boolean
        constraints:
          $ref: '#/components/schemas/Constraints'
        displayOrder:
          type: integer
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              value:
                type: string
              displayValue:
                type: string
    CreateAttributeTemplateRequest:
      type: object
      required: [name, displayName, inputType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
          description: Mã kỹ thuật, chữ thường không dấu, chữ số, gạch dưới; không đổi sau khi tạo. Sai dạng thì `CATALOG_FIELD_INVALID`, không tự sửa.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        hint:
          type: string
          maxLength: 200
        inputType:
          $ref: '#/components/schemas/InputType'
        unit:
          type: string
          maxLength: 20
          description: Chỉ khi `inputType` là `NUMBER`
    UpdateAttributeTemplateRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        hint:
          type: string
          maxLength: 200
    AddOptionRequest:
      type: object
      required: [value, displayValue]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$'
          description: Mã kỹ thuật, chữ thường không dấu, chữ số, gạch dưới hoặc gạch ngang; không đổi. Sai dạng thì `CATALOG_FIELD_INVALID`.
        displayValue:
          type: string
          minLength: 1
          maxLength: 100
    UpdateOptionRequest:
      type: object
      required: [displayValue]
      properties:
        displayValue:
          type: string
          minLength: 1
          maxLength: 100
    ReorderOptionsRequest:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          items:
            type: string
            format: uuid
    AttributeOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
        displayValue:
          type: string
        sortOrder:
          type: integer
        status:
          $ref: '#/components/schemas/Status'
    AttributeTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        hint:
          type: string
          nullable: true
        inputType:
          $ref: '#/components/schemas/InputType'
        unit:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/Status'
        usable:
          type: boolean
          description: Đang dùng và, với kiểu chọn, còn ít nhất một tùy chọn đang dùng
        version:
          type: integer
          format: int64
        options:
          type: array
          items:
            $ref: '#/components/schemas/AttributeOption'
    AttributeTemplatePage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              displayName:
                type: string
              inputType:
                $ref: '#/components/schemas/InputType'
              unit:
                type: string
                nullable: true
              status:
                $ref: '#/components/schemas/Status'
              optionCount:
                type: integer
        total:
          type: integer
          format: int64
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        version:
          type: integer
          format: int64
    BrandPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        total:
          type: integer
          format: int64
    AdminBrandPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        total:
          type: integer
          format: int64
    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED]
      description: Feature 07 chỉ tạo `DRAFT`; đăng và gỡ ở feature 09.
    AttributeValueInput:
      type: object
      required: [templateId, values]
      properties:
        templateId:
          type: string
          format: uuid
        values:
          type: array
          description: |-
            Kiểu chọn một, chọn nhiều: mã tùy chọn. Các kiểu còn lại (chữ, số, đúng/sai, ngày): đúng một chuỗi.
          items:
            type: string
        axis:
          type: boolean
          default: false
          description: Làm trục biến thể. Chỉ mẫu kiểu chọn một; tối đa 2 dòng `axis` trong một sản phẩm. Với dòng này, `values` là tập giá trị của trục.
    CreateProductRequest:
      type: object
      required: [title, categoryId]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: Chữ thuần; ký tự đặc biệt lưu như chữ, không từ chối
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValueInput'
    UpdateProductRequest:
      type: object
      description: Mọi trường tùy chọn; vắng thì giữ nguyên. `attributes` gửi thì thay toàn bộ danh sách.
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        brandId:
          type: string
          format: uuid
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValueInput'
    ProductAttribute:
      type: object
      properties:
        templateId:
          type: string
          format: uuid
        name:
          type: string
          description: Tên hiển thị hiện tại của mẫu
        axis:
          type: boolean
        options:
          type: array
          description: |-
            Kiểu chọn một, chọn nhiều; tên lấy từ mẫu tại lúc đọc. Tùy chọn đã ngừng vẫn trả, `usable: false`.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              displayValue:
                type: string
              usable:
                type: boolean
        value:
          type: string
          nullable: true
          description: Các kiểu còn lại, dạng chuỗi chuẩn hóa
    MissingPublishCondition:
      type: object
      properties:
        code:
          type: string
          enum: [REQUIRED_ATTRIBUTE_MISSING, NO_ACTIVE_VARIANT, NO_IMAGE, SELLER_NOT_APPROVED, CATEGORY_NOT_USABLE]
        templateId:
          type: string
          format: uuid
          nullable: true
          description: Có khi `code` là `REQUIRED_ATTRIBUTE_MISSING`
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        version:
          type: integer
          format: int64
          description: Tăng mỗi lần sản phẩm hay biến thể của nó đổi
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        images:
          type: array
          description: Danh sách ảnh của sản phẩm theo vị trí
          items:
            $ref: '#/components/schemas/ProductImage'
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Thời điểm đăng đầu tiên
        missingPublishConditions:
          type: array
          items:
            $ref: '#/components/schemas/MissingPublishCondition'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        version:
          type: integer
          format: int64
        variantCount:
          type: integer
        minPrice:
          type: integer
          format: int64
          nullable: true
        maxPrice:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
          format: date-time
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
          format: int64
    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        position:
          type: integer
          minimum: 0
        contentType:
          type: string
        size:
          type: integer
    RequestImageUploadRequest:
      type: object
      required: [contentType, size]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          description: Tối đa 5 MB, cấu hình được
    UploadSlotResponse:
      type: object
      properties:
        slotId:
          type: string
          format: uuid
        url:
          type: string
          description: Địa chỉ tải lên
        fields:
          type: object
          additionalProperties:
            type: string
          description: |-
            Object chuỗi → chuỗi, gửi nguyên làm trường form, rồi tệp ở trường cuối tên file
        expiresAt:
          type: string
          format: date-time
        maxSize:
          type: integer
    ConfirmImageRequest:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid
    ReorderImagesRequest:
      type: object
      required: [imageIds]
      properties:
        imageIds:
          type: array
          description: Mảng uuid, đủ mọi ảnh một lần
          items:
            type: string
            format: uuid
    CombinationItem:
      type: object
      required: [templateId, optionId]
      properties:
        templateId:
          type: string
          format: uuid
        optionId:
          type: string
          format: uuid
    AddVariantRequest:
      type: object
      required: [combination, price]
      properties:
        combination:
          type: array
          description: Đúng một mã tùy chọn cho mỗi trục; rỗng nếu sản phẩm không có trục
          items:
            $ref: '#/components/schemas/CombinationItem'
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: Đồng, số nguyên
        sku:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
    UpdateVariantRequest:
      type: object
      description: |-
        Vắng thì giữ nguyên; `sku: null` bỏ SKU.
      properties:
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        sku:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        combination:
          type: array
          items:
            $ref: '#/components/schemas/CombinationItem'
        price:
          type: integer
          format: int64
        sku:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
          description: Tên hằng của mã lỗi catalog hoặc mã lỗi chung
        errors:
          type: array
          items:
            type: string
        traceId:
          type: string
