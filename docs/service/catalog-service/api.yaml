          schema: { type: string }
        - name: skuId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseVoid' }
        "404":
          $ref: '#/components/responses/404'
