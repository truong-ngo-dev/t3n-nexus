openapi: 3.0.3
info:
  title: Danh mục hàng
  version: 0.1.0
  description: |
    Sống. **Các điểm cuối `/api/categories`, `/api/brands`, `/api/admin/...` là Đã làm** (feature 05, cấu trúc danh mục; chạy thật `2026-11-04`). Điểm cuối `/api/seller/products` (sản phẩm, biến thể) là **Đã làm** (feature 07, chạy thật `2026-11-05`); điểm cuối ảnh `/api/seller/products/{id}/images...` là **Đã làm** (feature 08). Các điểm cuối đăng, gỡ, xóa nháp là **Đã làm** (feature 09).

    Mọi đường cần token (đăng nhập). Đường đọc: vai nào cũng được. Đường ghi dưới `/api/admin/`: vai `ADMIN` là quy tắc nghiệp vụ do use case kiểm
    (403 `CATALOG_ROLE_NOT_ALLOWED`), không phải phân quyền truy cập. Người thực hiện luôn lấy từ token, không có trong đường dẫn hay nội dung.

    Phiên bản (`version`) chạy ngầm: lệnh sửa không gửi phiên bản; hai quản trị sửa cùng một thực thể cùng lúc thì bên sau nhận 409 `CONCURRENT_UPDATE`
    (thử lại sau khi tải lại). Lệnh ghi trả tài nguyên sau thay đổi kèm `version`.

    Mẫu thuộc tính, tùy chọn, thương hiệu **không có thao tác xóa**, chỉ `deactivate` và `activate`. Danh mục có `DELETE` (chỉ khi không còn con).

    Phản hồi bọc `ApiResponse` chung: `success`, `data`, `message`, `errors`, `code`, `traceId`. Lỗi nghiệp vụ có `code` là tên hằng bên dưới. Phân trang: `page` từ 0,
    `size` mặc định 20, tối đa 50 (vượt thì cắt về 50).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/categories:
    get:
      summary: Cây danh mục để chọn
      description: Ba cấp lồng nhau, sắp theo `sortOrder`; chỉ nhánh dùng được (danh mục `INACTIVE` bị ẩn cùng nhánh con). Không ghi gì, không phát event.
      operationId: getCategoryTree
      responses:
        '200':
          description: Cây
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTreeNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/categories/{id}/attributes:
    get:
      summary: Thuộc tính được gán cho một danh mục lá
      description: Chỉ mẫu dùng được, kèm các tùy chọn đang dùng theo thứ tự chuẩn. Danh mục không phải lá trả danh sách rỗng.
      operationId: getCategoryAttributes
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAttribute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/brands:
    get:
      summary: Danh sách thương hiệu đang dùng
      operationId: listBrands
      parameters:
        - name: keyword
          in: query
          description: Tìm theo tên (không phân biệt hoa thường, dấu)
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/categories/tree:
    get:
      summary: Cây đầy đủ cho quản trị
      description: Mọi trạng thái, kèm `usable` (chính nó và mọi tổ tiên đang dùng), `sortOrder`, `version`.
      operationId: getAdminCategoryTree
      responses:
        '200':
          description: Cây
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategoryNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
  /api/admin/categories:
    post:
      summary: Tạo danh mục
      description: |
        Gốc (không `parentId`) hoặc con của danh mục đã có (cha đang ngừng dùng vẫn được). Xếp cuối các anh em.
        Một giao dịch: lưu, hàng hộp thư `EVT-CAT-03`, bản ghi kiểm toán `CATEGORY_CREATED`.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            - `CATEGORY_NAME_TAKEN`: tên đã dùng trong cùng cha (so sau chuẩn hóa: bỏ dấu, chữ thường, bỏ khoảng trắng thừa)
            - `CATEGORY_MAX_DEPTH_EXCEEDED`: cha đã là cấp ba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/categories/reorder:
    put:
      summary: Sắp xếp các anh em cùng cha
      description: Danh sách phải có mọi anh em cùng cha (cha rỗng thì là các danh mục gốc), mỗi cái đúng một lần. Ghi `CATEGORY_UPDATED` (`change` là `REORDERED`).
      operationId: reorderCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCategoriesRequest'
      responses:
        '200':
          description: Thứ tự mới
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CATEGORY_INVALID_ORDER`: danh sách thiếu, thừa hoặc lặp anh em; hoặc `CONCURRENT_UPDATE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/categories/{id}:
    put:
      summary: Đổi tên danh mục
      description: Ghi `CATEGORY_UPDATED` (`change` là `RENAMED`). Đổi chỉ khác hoa thường với chính nó không phải là trùng.
      operationId: renameCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: Danh mục sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CATEGORY_NAME_TAKEN` hoặc `CONCURRENT_UPDATE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Xóa danh mục
      description: |
        Chỉ khi không còn con. Ghi `CATEGORY_DELETED` (kèm tên và cha, vì sau khi xóa không còn chỗ tra) và `EVT-CAT-03`.
        Nửa "chưa từng có sản phẩm" (INV-CAT-98) kiểm từ feature 07.
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CATEGORY_HAS_CHILDREN`: còn con; `CATEGORY_HAS_PRODUCTS`: còn sản phẩm tham chiếu (kiểm sau lần kiểm con); gợi ý ngừng dùng'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/categories/{id}/deactivate:
    post:
      summary: Ngừng dùng danh mục
      description: Không cascade xuống con; con không còn "dùng được". Ghi `CATEGORY_DEACTIVATED`.
      operationId: deactivateCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Danh mục sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/admin/categories/{id}/activate:
    post:
      summary: Bật lại danh mục
      description: Ghi `CATEGORY_UPDATED` (`change` là `ACTIVATED`).
      operationId: activateCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Danh mục sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/admin/categories/{id}/assignments:
    get:
      summary: Danh sách thuộc tính được gán (quản trị)
      description: Đủ mọi dòng gán, kể cả mẫu nay đã ngừng dùng.
      operationId: getCategoryAssignments
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/categories/{id}/attributes:
    put:
      summary: Thay toàn bộ danh sách thuộc tính được gán
      description: |
        Gửi danh sách mong muốn cuối cùng; thêm, bỏ, đổi bắt buộc, thứ tự đều làm bằng một lần gọi. Chỉ danh mục cấp ba (lá).
        Mẫu **mới thêm** phải dùng được; mẫu đã gán từ trước mà nay ngừng dùng vẫn giữ và sửa được. Một bản ghi kiểm toán `CATEGORY_UPDATED`
        (`change` là `ASSIGNMENTS_REPLACED`) và `EVT-CAT-03`.
      operationId: replaceCategoryAttributes
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAssignmentsRequest'
      responses:
        '200':
          description: Danh sách mới
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAssignment'
        '400':
          description: '`ATTRIBUTE_CONSTRAINTS_INVALID`: ràng buộc không hợp với kiểu nhập của mẫu; hoặc dữ liệu sai (`CATALOG_FIELD_INVALID`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            - `CATEGORY_NOT_LEAF`: danh mục không phải cấp ba
            - `ATTRIBUTE_ASSIGNMENT_DUPLICATED`: một mẫu xuất hiện hai lần trong danh sách
            - `ATTRIBUTE_TEMPLATE_INACTIVE`: mẫu mới thêm không dùng được (đã ngừng, hoặc kiểu chọn không còn tùy chọn đang dùng)
            - `CONCURRENT_UPDATE`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/attribute-templates:
    get:
      summary: Danh sách mẫu thuộc tính
      operationId: listAttributeTemplates
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: inputType
          in: query
          schema:
            $ref: '#/components/schemas/InputType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang tóm tắt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
    post:
      summary: Tạo mẫu thuộc tính
      description: Kiểu nhập và đơn vị không đổi sau khi tạo; chỉ kiểu `NUMBER` có đơn vị. Ghi `ATTRIBUTE_CREATED`; `EVT-CAT-03`.
      operationId: createAttributeTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttributeTemplateRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '409':
          description: '`ATTRIBUTE_TEMPLATE_NAME_TAKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/attribute-templates/{id}:
    get:
      summary: Chi tiết mẫu kèm mọi tùy chọn
      operationId: getAttributeTemplate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Sửa tên hiển thị và gợi ý
      description: Không có lệnh đổi tên, kiểu nhập hay đơn vị. Áp ngay mọi nơi đang dùng mẫu. Ghi `ATTRIBUTE_UPDATED`.
      operationId: updateAttributeTemplate
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttributeTemplateRequest'
      responses:
        '200':
          description: Mẫu sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONCURRENT_UPDATE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/attribute-templates/{id}/deactivate:
    post:
      summary: Ngừng dùng mẫu
      description: Sản phẩm đang dùng giữ giá trị; mẫu không gán được cho danh mục mới. Ghi `ATTRIBUTE_DEACTIVATED`.
      operationId: deactivateAttributeTemplate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Mẫu sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/admin/attribute-templates/{id}/activate:
    post:
      summary: Bật lại mẫu
      description: Ghi `ATTRIBUTE_UPDATED` (`change` là `ACTIVATED`).
      operationId: activateAttributeTemplate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Mẫu sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/admin/attribute-templates/{id}/options:
    post:
      summary: Thêm tùy chọn
      description: Chỉ mẫu kiểu chọn và đang dùng; xếp cuối. Ghi `ATTRIBUTE_UPDATED` (`change` là `OPTION_ADDED`).
      operationId: addAttributeOption
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOptionRequest'
      responses:
        '201':
          description: Mẫu sau khi thêm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            - `ATTRIBUTE_OPTION_VALUE_TAKEN`: giá trị đã có trong mẫu
            - `ATTRIBUTE_INPUT_TYPE_NOT_SELECT`: mẫu không phải kiểu chọn
            - `ATTRIBUTE_TEMPLATE_INACTIVE`: mẫu đã ngừng dùng
            - `CONCURRENT_UPDATE`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/attribute-templates/{id}/options/order:
    put:
      summary: Sắp xếp tùy chọn
      description: Danh sách phải có mọi tùy chọn của mẫu, mỗi cái đúng một lần.
      operationId: reorderAttributeOptions
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderOptionsRequest'
      responses:
        '200':
          description: Mẫu sau khi sắp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ATTRIBUTE_INVALID_OPTION_ORDER`: thiếu, thừa hoặc lặp tùy chọn; hoặc `CONCURRENT_UPDATE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/attribute-templates/{id}/options/{optionId}:
    put:
      summary: Sửa tên hiển thị của tùy chọn
      description: Giá trị chuẩn (`value`) không đổi; muốn đổi nghĩa thì thêm tùy chọn mới và ngừng tùy chọn cũ. Sửa được cả khi tùy chọn hay mẫu đã ngừng.
      operationId: updateAttributeOption
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/OptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOptionRequest'
      responses:
        '200':
          description: Mẫu sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRoleRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONCURRENT_UPDATE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/attribute-templates/{id}/options/{optionId}/deactivate:
    post:
      summary: Ngừng dùng tùy chọn
      description: |
        Được phép cả với tùy chọn cuối cùng còn đang dùng (mẫu khi đó không dùng được, sản phẩm cũ giữ giá trị; INV-CAT-11 không kiểm lúc ngừng).
        Ghi `ATTRIBUTE_UPDATED` (`change` là `OPTION_DEACTIVATED`).
      operationId: deactivateAttributeOption
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/OptionId'
      responses:
        '200':
          description: Mẫu sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
