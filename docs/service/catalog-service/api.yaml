          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SellerRoleRequired'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`VARIANT_COMBINATION_TAKEN`, `VARIANT_LIMIT_REACHED` (đã 50), `VARIANT_SKU_TAKEN` (trùng SKU trong cùng người bán, kể cả sản phẩm khác)'
