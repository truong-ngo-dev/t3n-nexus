openapi: 3.0.3
info:
  title: Xác thực
  version: 0.1.0
  description: |
    Sống. Đã làm: `POST /register` (feature 01); đăng nhập, cấp mã và đổi mã lấy token (feature 02); đăng xuất (`GET`, `POST` `/connect/logout`, feature 03). Giới hạn đăng ký theo địa chỉ mạng do cổng truy cập thực hiện (feature 06), chưa làm; giới hạn đăng nhập do chính dịch vụ này thực hiện.
    Công khai qua cổng truy cập dưới tiền tố `/auth`.
servers:
  - url: /auth
paths:
  /register:
    post:
      summary: Đăng ký tài khoản (vai Người dùng)
      description: |
        Tạo tài khoản đăng nhập vai Người dùng, trạng thái hoạt động. Vai không phải đầu vào: trường lạ gửi kèm bị bỏ qua.
        Không tạo phiên; người dùng đăng nhập ở bước sau.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400':
          description: Đầu vào không hợp lệ (`EMAIL_INVALID`, `EMAIL_RESERVED`, `PASSWORD_INVALID`, hoặc thiếu trường: `VALIDATION_FAILED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Email đã có tài khoản (`EMAIL_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Vượt giới hạn tần suất (`TOO_MANY_REQUESTS`)
          headers:
            Retry-After:
              description: Số giây nên chờ
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /login:
    get:
      summary: Trang đăng nhập
      description: |
        Trả trang đăng nhập (HTML). Khi trình duyệt chưa có cookie `DEVICE_KEY` thì cấp cookie mới ngay ở đây, trước khi nhập mật khẩu:
        ngẫu nhiên 256 bit, `HttpOnly`, `Secure`, `SameSite=Lax`, `Path=/`, 12 tháng; đã có thì không đổi.
      operationId: showLogin
      responses:
        '200':
          description: Trang đăng nhập, kèm biểu mẫu có mã CSRF
          headers:
            Set-Cookie:
              description: "`DEVICE_KEY` (chỉ khi chưa có) và cookie phiên"
              schema: { type: string }
          content:
            text/html: { schema: { type: string } }
    post:
      summary: Đăng nhập bằng email và mật khẩu
      description: |
        Biểu mẫu của trang đăng nhập, cần mã CSRF (`_csrf`). Sai email và sai mật khẩu cho cùng một kết quả. Thành công thì mở phiên người
        dùng rồi chuyển hướng về yêu cầu cấp mã đang chờ. Thiếu hoặc sai mã CSRF thì bị từ chối và quay về trang đăng nhập.
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, _csrf]
              properties:
                username: { type: string, description: Email }
                password: { type: string }
                _csrf: { type: string }
      responses:
        '302':
          description: "Thành công: về `/oauth2/authorize` đang chờ. Thất bại: về `/login?error` (tài khoản chưa hoạt động: `?locked`; không mở được phiên hoặc lỗi hệ thống: `?unavailable`)"
        '429':
          description: Vượt giới hạn số lần thử (5 lần trong 5 phút cho mỗi cặp email và địa chỉ mạng; 15 lần trong 15 phút cho mỗi email). Trả lại trang đăng nhập kèm thông báo, không xác thực mật khẩu và không mở phiên dù mật khẩu đúng
          headers:
            Retry-After:
              description: Số giây nên chờ (độ dài cửa sổ đếm)
              schema: { type: integer }
          content:
            text/html: { schema: { type: string } }
  /oauth2/authorize:
    get:
      summary: Yêu cầu cấp mã ủy quyền (OIDC)
      description: |
        Bắt buộc `state`; client trình duyệt (`web-gateway`) bắt buộc PKCE (`code_challenge`, `code_challenge_method=S256`). Thiếu thì chuyển hướng
        tới `redirect_uri` đã đăng ký kèm `error=invalid_request`. Chưa đăng nhập thì chuyển hướng tới `/login`; phiên đã hết hạn hoặc đã bị xóa
        cũng vậy. Đã đăng nhập thì cấp mã ngay (SSO).
      operationId: authorize
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, required: true, schema: { type: string, example: openid profile email } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302': { description: "Về `redirect_uri` kèm `code` và `state`, hoặc `error`; hoặc về `/login`" }
  /oauth2/token:
    post:
      summary: Đổi mã lấy token, làm mới token
      description: |
        Không cần mã CSRF; client xác thực bằng `client_secret_basic`. Đổi mã cần `code_verifier` (PKCE). Làm mới cần tham số `sid` khớp với
        `sid` trong token. Mã đăng nhập mang `sub` (mã tài khoản), `role`, `sid`, `exp` (không quá hạn phiên); không mang email, tên, mã phiên Spring.
      operationId: token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                sid: { type: string, format: uuid, description: Bắt buộc khi làm mới }
      responses:
        '200': { description: "`access_token`, `refresh_token`, `id_token`, `expires_in`" }
        '400': { description: "`invalid_grant` (mã sai, thiếu hoặc sai `code_verifier`, phiên hết hạn), `invalid_request`" }
        '401': { description: Client xác thực sai }
  /connect/logout:
    get:
      summary: Đăng xuất (OIDC RP-Initiated Logout)
      description: |
        Trình duyệt tới đây sau khi ứng dụng (BFF) đã xóa phiên của nó. Spring Authorization Server kiểm `id_token_hint` (ID token do chính Xác thực cấp, kiểm chữ ký và issuer, **không kiểm hạn**; tra bản ghi theo `sid`), client và `post_logout_redirect_uri` (phải thuộc danh sách đã đăng ký của client).
        Cookie đăng nhập (`OAUTH2_SESSION`) quyết định phiên nào bị kết thúc: phiên người dùng tìm theo cookie phải chứa phiên ứng dụng `sid` của hint. Khi đó, trong một giao dịch, xóa phiên người dùng, mọi phiên ứng dụng của nó và các bản ghi ủy quyền; rồi hủy session Spring (`DEVICE_KEY` giữ nguyên) và báo BFF xóa mã theo `sid`.
        Luôn thành công khi yêu cầu hợp lệ: không có cookie, phiên đã hết hạn hoặc đã kết thúc, hint của phiên khác thì không kết thúc gì và vẫn chuyển hướng. Hint không tra được (đã đăng xuất, ký sai, sai chủ) thì về `/` và không động tới session nào, để đăng xuất lần hai không hiện lỗi.
        Chấp nhận cả `POST` với cùng tham số.
      operationId: logout
      parameters:
        - { name: id_token_hint, in: query, required: true, schema: { type: string }, description: ID token đã cấp cho phiên (có thể đã hết hạn) }
        - { name: post_logout_redirect_uri, in: query, required: false, schema: { type: string, example: 'http://localhost:4200' }, description: Phải nằm trong danh sách đã đăng ký của client }
        - { name: state, in: query, required: false, schema: { type: string }, description: Được trả lại ở trang đích }
        - { name: client_id, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: "Về `post_logout_redirect_uri` kèm `state` (khi hint hợp lệ và có trang đích), hoặc về `/` (không có trang đích, hoặc `id_token_hint` không tra được)"
        '400':
          description: "`invalid_request`: thiếu `id_token_hint`, trang đích không đăng ký, hoặc `client_id` không khớp. Không kết thúc phiên nào và không chuyển hướng"
components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: Được chuẩn hóa (cắt khoảng trắng, chữ thường) trước khi lưu
        password:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9@$]+$'
          description: Từ 8 đến 64 ký tự, chỉ gồm chữ A-Z a-z, số 0-9 và hai ký tự `@` `$`; có ít nhất một chữ cái và một chữ số (luật "Mật khẩu hợp lệ" ở analysis). Dấu cách, emoji, chữ có dấu bị từ chối
    RegisterResponse:
      description: Khung phản hồi chung của mọi endpoint (success, data); dữ liệu là mã tài khoản
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [userAccountId]
          properties:
            userAccountId:
              type: string
              format: uuid
              description: Mã tài khoản (UUID v7)
    Error:
      description: Khung phản hồi lỗi chung; `code` chữ ổn định để giao diện dịch hoặc rẽ nhánh
      type: object
      required: [success, message, code]
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          description: "Mã lỗi chữ ổn định: EMAIL_INVALID, EMAIL_RESERVED, PASSWORD_INVALID, EMAIL_TAKEN, VALIDATION_FAILED, TOO_MANY_REQUESTS, INTERNAL_ERROR"
        message: { type: string, description: "Tiếng Việt, nêu lý do" }
        errors:
          type: array
          items: { type: string }
          description: Chi tiết từng trường khi `code` là VALIDATION_FAILED
