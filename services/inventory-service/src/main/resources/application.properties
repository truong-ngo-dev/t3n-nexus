spring.application.name=inventory-service
server.port=8006

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5437/inventory_db
spring.datasource.username=${DB_USERNAME:t3nexus}
spring.datasource.password=${DB_PASSWORD:t3nexus}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis - idempotency guard + limited offer slot counter (Phase 4)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka - bootstrap
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka - producer (Saga reply events via Outbox Debezium, no direct publish)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka - consumer (shared base config, overridden per listener factory if needed)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Kafka - consumer groups
app.kafka.consumer-group.catalog=inventory-catalog-consumer
app.kafka.consumer-group.order=inventory-order-consumer

# Kafka - consumed topics (catalog)
app.kafka.topic.product-published=catalog.product.published
app.kafka.topic.product-unpublished=catalog.product.unpublished
app.kafka.topic.product-blocked=catalog.product.blocked
app.kafka.topic.product-unblocked=catalog.product.unblocked
app.kafka.topic.variant-created=catalog.variant.created
app.kafka.topic.variant-deactivated=catalog.variant.deactivated
app.kafka.topic.variant-activated=catalog.variant.activated

# Kafka - consumed topics (order)
app.kafka.topic.order-created=order.order.created
app.kafka.topic.order-cancelled=order.order.cancelled

# Kafka - DLQ
app.kafka.topic.dlq=inventory-service.dlq

# Idempotency - Redis TTL for processed event keys (7 days)
app.idempotency.ttl=7d

# Security
# Direct jwk-set-uri (not issuer-uri) -- internal validation, no dependency on api-gateway/public issuer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8004/oauth2/jwks

# Observability
management.tracing.sampling.probability=1.0
