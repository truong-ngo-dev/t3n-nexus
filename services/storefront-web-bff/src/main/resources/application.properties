spring.application.name=storefront-web-bff

spring.cloud.discovery.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}

# OAuth2 Client
spring.security.oauth2.client.registration.storefront-web.provider=storefront-web
spring.security.oauth2.client.registration.storefront-web.client-id=${STOREFRONT_WEB_CLIENT_ID:storefront-web}
spring.security.oauth2.client.registration.storefront-web.client-secret=${STOREFRONT_WEB_CLIENT_SECRET:secret}
spring.security.oauth2.client.registration.storefront-web.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.storefront-web.redirect-uri={baseUrl}/login/oauth2/code/storefront-web
spring.security.oauth2.client.registration.storefront-web.scope=openid,profile,email

# Explicit endpoints - avoids startup-time OIDC discovery fetch against oauth2-service
# authorization-uri is client-facing (browser gets redirected here): host auth (ADR-0006), khong tien to; mien that chi doi AUTH_PUBLIC_URL.
# token-uri/jwk-set-uri/user-info-uri are server-to-server (storefront-web-bff calls these itself) -- still point
# directly at internal oauth2-service, not through api-gateway.
spring.security.oauth2.client.provider.storefront-web.authorization-uri=${AUTH_PUBLIC_URL:http://auth.localhost:8000}/oauth2/authorize
spring.security.oauth2.client.provider.storefront-web.token-uri=http://localhost:8004/oauth2/token
spring.security.oauth2.client.provider.storefront-web.jwk-set-uri=http://localhost:8004/oauth2/jwks
spring.security.oauth2.client.provider.storefront-web.user-info-uri=http://localhost:8004/userinfo
spring.security.oauth2.client.provider.storefront-web.user-name-attribute=sub

# Trust X-Forwarded-* from api-gateway so {baseUrl} (redirect-uri) resolves to the public
# address instead of internal localhost:8090 -- required now that api-gateway sits in front.
server.forward-headers-strategy=framework

# Resource server validates service-account tokens (SCOPE_storefront.internal) on /bff/internal/**
# — xem SecurityConfiguration.internalFilterChain() + oauth2-service StorefrontWebBffRevocationClient
# (mint token qua client_credentials grant, migration V10).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8004/oauth2/jwks

# Server
server.port=8090

# CORS: danh sach mau nguon goc (cach nhau dau phay); dev: moi subdomain cua localhost; demo hoac that: dat dung nguon goc (ADR-0006, khong dung *).
# FRONTEND_URL (nguon goc cong khai cua ung dung Cua hang) dung cho hai dia chi chuyen huong ben duoi; docs/global/technical-debt.md.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://*.localhost:*}

# Post-login redirect - browser lands here after OAuth2 callback processed (Angular SPA)
app.login.success-redirect-uri=${FRONTEND_URL:http://shop.localhost:8000}/account

# Post-logout redirect - browser lands here after OIDC end_session
app.logout.post-redirect-uri=${FRONTEND_URL:http://shop.localhost:8000}/
# OIDC end_session endpoint - not discoverable when issuer-uri is absent. Client-facing -- goes through api-gateway.
app.logout.end-session-uri=${AUTH_PUBLIC_URL:http://auth.localhost:8000}/connect/logout

# Backend service URIs
storefront.routes.oauth2-service.uri=http://localhost:8004
storefront.routes.identity-service.uri=http://localhost:8001
storefront.routes.customer-service.uri=http://localhost:8002
storefront.routes.catalog-service.uri=http://localhost:8005
storefront.routes.order-service.uri=http://localhost:8007

# Han phien BFF = TTL cua refresh token o oauth2-service (tech.md T5, T6 cach A); dat lai moi lan luu token moi.
# Han anh xa sid <-> phien BFF = han phien + an han, khong bao gio ngan hon han phien.
app.session.ttl=7d
app.session.mapping-grace=5m
spring.session.timeout=${app.session.ttl}

# Do lech dong ho khi quyet dinh lam moi token truy cap (mac dinh Spring 60s lam moi qua som voi access ngan, tech.md T5)
app.security.client.clock-skew=5s

# Do lech dong ho cua bo giai ma token dich vu (nhu oauth2-service, R18)
app.security.jwt.clock-skew=5s

# Per-user rate limit - generic technical safety net for /api/**, not a business rule
# (OTP/login-specific throttles stay explicit in each service's application layer)
app.ratelimit.default.limit=300
app.ratelimit.default.window-seconds=60

