spring.application.name=audit-service
server.port=8010

# Hai kết nối (ADR-0009): dịch vụ chạy bằng audit_app (chỉ INSERT, SELECT); Flyway chạy bằng audit_owner (chủ bảng)
spring.datasource.url=jdbc:postgresql://localhost:5440/audit_db
spring.datasource.username=${AUDIT_DB_USERNAME:audit_app}
spring.datasource.password=${AUDIT_DB_PASSWORD:audit_app}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${AUDIT_MIGRATION_USERNAME:audit_owner}
spring.flyway.password=${AUDIT_MIGRATION_PASSWORD:audit_owner}
# Tên tài khoản dịch vụ để migration cấp quyền (placeholder ${appRole} trong V1)
spring.flyway.placeholders.appRole=${AUDIT_DB_USERNAME:audit_app}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.audit.topic=audit.action.recorded

