spring.application.name=oauth2-service
server.port=8004

spring.datasource.url=jdbc:postgresql://localhost:5435/oauth2_db
spring.datasource.username=${DB_USERNAME:t3nexus}
spring.datasource.password=${DB_PASSWORD:t3nexus}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

app.kafka.consumer-group=oauth2-service
app.kafka.topic.session-revoked=oauth2.session.revoked
app.kafka.topic.password-setup-resent=oauth2.credential.password-setup-resent
app.kafka.topic.user-activated=identity.user.activated
app.kafka.topic.dlq=oauth2-service.dlq

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Password setup token
app.password-setup.hmac-secret=${PASSWORD_SETUP_HMAC_SECRET:changeme-password-setup-secret-32}
app.password-setup.token-ttl-seconds=86400
app.password-setup.cooldown-seconds=60

app.webgateway.base-url=http://localhost:8090
# Service-account client (client_credentials grant) — dùng bởi WebGatewayRevocationClient để tự
# mint token gọi POST /webgw/internal/sessions/revoke, seed ở migration V10.
app.internal-client.client-id=oauth2-service-internal
app.internal-client.client-secret=${INTERNAL_CLIENT_SECRET:changeme-internal-client-secret}

management.tracing.sampling.probability=1.0
#logging.level.io.micrometer.tracing=DEBUG
#logging.level.org.springframework.boot.actuate.autoconfigure.tracing=DEBUG

# --- DEBUG ---
#logging.level.org.springframework.security=TRACE
#logging.level.org.springframework.security.oauth2=TRACE
#logging.level.org.springframework.security.web.authentication=TRACE
#logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Security
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=OAUTH2_SESSION
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.device-key.max-age=365d
app.device-key.secure=${SESSION_COOKIE_SECURE:true}
# Issuer is the public-facing identity (embedded in JWT iss claim + OIDC discovery) -- via api-gateway /auth/**,
# not the internal address 8004. oauth2-service itself still runs on port 8004, internal endpoints
# (/oauth2/authorize, /oauth2/token...) keep their path, only the public identifier changes.
spring.security.oauth2.authorizationserver.issuer=http://localhost:8000/auth
server.forward-headers-strategy=framework
# Địa chỉ nội bộ của chính dịch vụ này (không qua api-gateway); hiện chỉ WebGatewayRevocationClient dùng để xin token nội bộ.
app.oauth2.internal-base-url=http://localhost:8004
# Cả 2 dòng dưới cùng derive từ 1 env var FRONTEND_URL -- xem docs/global/technical-debt.md
# "Chuẩn hoá FRONTEND_URL" để không lệch giữa CORS origin và link build trong response.
# Giới hạn số lần thử đăng nhập (tech.md T3): theo cặp (email, địa chỉ mạng) và riêng email; mọi lần thử đều đếm.
# Độ lệch đồng hồ chấp nhận khi bộ giải mã của /api kiểm exp, nbf (Spring mặc định 60s làm token sống quá hạn phiên).
app.security.jwt.clock-skew=5s
app.login.rate-limit.pair-attempts=5
app.login.rate-limit.pair-window=5m
app.login.rate-limit.email-attempts=15
app.login.rate-limit.email-window=15m
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# JWT Key encryption
jwt.key.id=${JWT_KEY_ID:t3n-nexus-oauth2-key}
jwt.persistence.password=${JWT_PERSISTENCE_PASSWORD:changeme-secret-password-32chars!!}
jwt.persistence.salt=${JWT_PERSISTENCE_SALT:deadbeef12345678}

# Google OAuth2 (social login)
client.google.client_id=${GOOGLE_CLIENT_ID:443094009014-4chs11j77td3u8kgta32i74djqv0525i.apps.googleusercontent.com}
client.google.secret=${GOOGLE_CLIENT_SECRET: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}

spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.client.registration.google.client-id=${client.google.client_id}
spring.security.oauth2.client.registration.google.client-secret=${client.google.secret}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=email

# Miền email nội bộ: không đăng ký công khai được (INV-ATH-07). Nhiều miền cách nhau bằng dấu phẩy.
app.internal-email-domains=${INTERNAL_EMAIL_DOMAINS:t3nexus.com.vn}

# ============================================================
# Hạn phiên và TTL token theo vai (feature 02, tech.md T1); profile dev ghi đè ở application-dev.properties.
# Ràng buộc kiểm lúc khởi động: refresh-ttl >= 2 x access-ttl, session-ttl > refresh-ttl.
# ============================================================
app.session.user.access-ttl=15m
app.session.user.refresh-ttl=7d
app.session.user.session-ttl=30d
app.session.internal.access-ttl=15m
app.session.internal.refresh-ttl=30m
app.session.internal.session-ttl=10h

# Tắt PKCE cho web-gateway tới khi cổng web gửi code_challenge (feature 06); bật bằng true
app.clients.web-gateway.require-proof-key=${WEB_GATEWAY_REQUIRE_PKCE:false}
