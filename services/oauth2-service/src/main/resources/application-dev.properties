# Profile dev: rút ngắn để thử được cả ba mốc trong một lần ngồi thử (feature 02, tech.md T1):
# access hết sau 1 phút (thấy làm mới), refresh hết sau 3 phút bỏ không (thấy SSO cấp lại token),
# hạn phiên sau 10 phút (thấy token bị cắt theo phiên rồi phải nhập lại mật khẩu).
app.session.user.access-ttl=1m
app.session.user.refresh-ttl=3m
app.session.user.session-ttl=10m
app.session.internal.access-ttl=1m
app.session.internal.refresh-ttl=3m
app.session.internal.session-ttl=10m

server.servlet.session.cookie.secure=false
app.device-key.secure=false
app.clients.storefront-web.secret=secret
