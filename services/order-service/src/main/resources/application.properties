spring.application.name=order-service
server.port=8007

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5438/order_db
spring.datasource.username=${DB_USERNAME:t3nexus}
spring.datasource.password=${DB_PASSWORD:t3nexus}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka - bootstrap
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka - producer (Saga events via Outbox Debezium, no direct publish)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka - consumer (shared base config, overridden per listener factory if needed)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Kafka - consumer group
app.kafka.consumer-group.inventory=order-inventory-consumer

# Kafka - consumed topics (inventory — Saga reply)
app.kafka.topic.inventory-reserved=inventory.reservation.created
app.kafka.topic.inventory-reservation-failed=inventory.reservation.failed

# Kafka - DLQ
app.kafka.topic.dlq=order-service.dlq

# Observability
management.tracing.sampling.probability=1.0
