spring.application.name=api-gateway
server.port=8000

spring.cloud.discovery.enabled=false

# Redis — dùng chung Redis container với web-gateway, chỉ khác key prefix (ratelimit:ip: vs ratelimit:user:)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Downstream routes
apigateway.routes.web-gateway.uri=http://localhost:8090
apigateway.routes.mobile-gateway.uri=http://localhost:8091
apigateway.routes.oauth2-service.uri=http://localhost:8004

# Địa chỉ public browser thấy — set X-Forwarded-Host/Proto thủ công cho downstream (xem RouteConfiguration)
apigateway.public-host=localhost:8000
apigateway.public-proto=http

# Per-IP rate limit — coarse edge safety net, áp dụng mọi request kể cả chưa authenticate
app.ratelimit.default.limit=300
app.ratelimit.default.window-seconds=60

# CORS — bắt buộc phải có ở đây (không chỉ web-gateway/oauth2-service), xem CorsConfiguration
app.cors.allowed-origins=http://localhost:4200
