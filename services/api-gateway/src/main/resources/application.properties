spring.application.name=api-gateway
server.port=8000

spring.cloud.discovery.enabled=false

# Redis -- shared Redis container with storefront-web-bff, only the key prefix differs (ratelimit:ip: vs ratelimit:user:)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Định tuyến theo Host (ADR-0006): tên máy của từng ứng dụng, không kèm cổng. Miền thật chỉ đổi các biến này.
app.gateway.hosts.auth=${AUTH_HOST:auth.localhost}
app.gateway.hosts.shop=${SHOP_HOST:shop.localhost}
# Giữ chỗ cho ứng dụng Vận hành: chưa có tuyến, host này hiện nhận 404
app.gateway.hosts.ops=${OPS_HOST:ops.localhost}
# Máy chủ giao diện Cửa hàng (feature 05): đường dẫn không thuộc BFF của host shop chuyển tới đây
app.gateway.frontends.shop=${SHOP_FRONTEND_URL:http://localhost:4200}

# Downstream routes
apigateway.routes.storefront-web-bff.uri=http://localhost:8090
apigateway.routes.oauth2-service.uri=http://localhost:8004

# Per-IP rate limit -- coarse edge safety net, applies to every request even before authentication
app.ratelimit.default.limit=300
app.ratelimit.default.window-seconds=60

# CORS: danh sách mẫu nguồn gốc (cách nhau dấu phẩy). Dev: mọi subdomain của localhost; demo/thật: đặt đúng nguồn gốc của ứng dụng.
# Không dùng * (kèm cookie bị trình duyệt từ chối và nới mọi nguồn gốc).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://*.localhost:*}

# Luật giới hạn tần suất theo (host, phương thức, đường dẫn), nạp lúc khởi động, sai cấu hình thì không khởi động (tech.md T1).
# host là khóa trong app.gateway.hosts (auth, shop, ops). Luật đầu: đăng ký, 10 yêu cầu mỗi giờ mỗi địa chỉ mạng.
app.ratelimit.rules[0].name=register
app.ratelimit.rules[0].host=auth
app.ratelimit.rules[0].method=POST
app.ratelimit.rules[0].path=/register
app.ratelimit.rules[0].limit=10
app.ratelimit.rules[0].window-seconds=3600
app.ratelimit.rules[0].enabled=true

# Thời gian chờ ngắn cho lệnh đếm Redis và cho việc kết nối (tech.md T3): Redis lỗi hay im lặng thì mở cửa kèm cảnh báo, không treo yêu cầu.
app.ratelimit.redis-timeout-ms=${RATELIMIT_REDIS_TIMEOUT_MS:200}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}

# Cổng là điểm vào ngoài cùng nên không tin X-Client-Ip của ai (nó tự đặt tiêu đề này từ địa chỉ kết nối, xem ForwardedHeadersSanitizer): danh sách proxy tin cậy rỗng
observability.logging.http.trusted-proxies=
