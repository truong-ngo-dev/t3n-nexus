spring.application.name=api-gateway
server.port=8000

spring.cloud.discovery.enabled=false

# Redis -- shared Redis container with web-gateway, only the key prefix differs (ratelimit:ip: vs ratelimit:user:)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Downstream routes
apigateway.routes.web-gateway.uri=http://localhost:8090
apigateway.routes.mobile-gateway.uri=http://localhost:8091
apigateway.routes.oauth2-service.uri=http://localhost:8004

# Public address the browser sees -- manually sets X-Forwarded-Host/Proto for downstream (see RouteConfiguration)
apigateway.public-host=localhost:8000
apigateway.public-proto=http

# Per-IP rate limit -- coarse edge safety net, applies to every request even before authentication
app.ratelimit.default.limit=300
app.ratelimit.default.window-seconds=60

# CORS -- must be configured here too (not just web-gateway/oauth2-service), see CorsConfiguration.
# Derives from FRONTEND_URL, xem docs/global/technical-debt.md "Chuẩn hoá FRONTEND_URL".
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
