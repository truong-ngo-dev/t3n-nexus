spring.application.name=catalog-service
server.port=8005

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5436/catalog_db
spring.datasource.username=${DB_USERNAME:t3nexus}
spring.datasource.password=${DB_PASSWORD:t3nexus}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hộp thư event chuyển bằng CDC (Debezium đọc bảng outbox_events); dịch vụ không tự gửi Kafka

# Observability
management.tracing.sampling.probability=1.0
#logging.level.io.micrometer.tracing=DEBUG
#logging.level.org.springframework.boot.actuate.autoconfigure.tracing=DEBUG

# Direct jwk-set-uri (not issuer-uri) -- internal validation, no dependency on api-gateway/public issuer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8004/oauth2/jwks

# Ảnh sản phẩm: cơ chế tải tệp dùng chung (upload-starter, ADR-0013). MinIO dev: docker compose service "minio".
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
upload.purposes.product-image.bucket=product-images
upload.purposes.product-image.key-prefix=products
upload.purposes.product-image.public-read=true
upload.purposes.product-image.public-base-url=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
upload.purposes.product-image.allowed-types=image/jpeg,image/png,image/webp
upload.purposes.product-image.max-size=5242880
upload.purposes.product-image.ttl=PT5M
upload.purposes.product-image.max-pending=9
catalog.limits.max-images=9

# Nhận kết quả duyệt người bán (feature 09): bản sao trạng thái người bán. Hàng chờ lỗi: catalog-service.dlq (ADR-0010).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
app.catalog.seller-approved-topic=seller.profile.approved
app.catalog.seller-rejected-topic=seller.profile.rejected

