spring.application.name=inapp-worker

# Pure Kafka consumer, no inbound HTTP port — cùng lý do email-worker.
spring.main.web-application-type=none

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
app.kafka.topic.inapp-dispatch=notification.inapp.dispatch
app.kafka.topic.dlq=inapp-worker.dlq
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.consumer-group.inapp=inapp-worker
app.kafka.concurrency.inapp=3

# Redis — Pub/Sub publish (user:{userId}:inapp) + shared bởi idempotency-support
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Idempotency Redis key TTL must exceed max Kafka redelivery window — cùng convention email-worker
# Pattern: "inapp:{notification_log_id}"
app.idempotency.ttl-hours=72

# Observability
management.tracing.sampling.probability=1.0
logging.level.io.micrometer.tracing=DEBUG

# Spring Boot 4.x: ConfigurationPropertiesReportEndpoint hardcodes com.fasterxml.jackson.datatype.jsr310.JavaTimeModule
# (Jackson 2.x) which no longer exists in Jackson 3.x - exclude the autoconfiguration entirely
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.context.properties.ConfigurationPropertiesReportEndpointAutoConfiguration
