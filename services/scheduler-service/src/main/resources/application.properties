spring.application.name=scheduler-service
server.port=8009

# OAuth2 Resource Server - REST API /api/admin/scheduled-jobs/** yeu cau JWT hop le (oauth2-service phat hanh)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8004/oauth2/jwks

# PostgreSQL — ScheduleStore, nguon su that (data.md)
spring.datasource.url=jdbc:postgresql://localhost:5439/scheduler_db
spring.datasource.username=${DB_USERNAME:t3nexus}
spring.datasource.password=${DB_PASSWORD:t3nexus}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis - DueItemFinder (ZSET scheduler:due, index tang toc tuy chon), KHONG phai nguon su that
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Misfire handling (implementation.md Phase 3) - nguong "tre qua xa" cap scheduler, KHONG phai per-job
# Default = 2x chu ky backstop poll (300s = 5 phut)
scheduler.misfire-threshold-seconds=600

# Poll cadence (Phase 4 - pipeline: IndexReconciler nap lai index, IndexPoller la nguon DUY NHAT claim+fire)
scheduler.index-reconciler.fixed-delay-ms=300000
scheduler.index-reconciler.initial-delay-ms=30000
scheduler.index-reconciler.lookahead-seconds=600
scheduler.index-reconciler.batch-limit=500
scheduler.index-poller.fixed-delay-ms=5000
scheduler.index-poller.batch-limit=100

# 2 @Scheduled poller doc lap (IndexReconciler + IndexPoller) khong duoc share 1 thread - default Spring
# Boot la 1, se khien IndexPoller bi block moi khi IndexReconciler dang quet batch (xem thao luan JDK vs
# Spring scheduling)
spring.task.scheduling.pool.size=2

# Observability - management.endpoints.web.exposure.include da duoc set mac dinh boi observability-starter
# (health,info,metrics,prometheus) qua ObservabilityEnvironmentPostProcessor - khong can khai lai o day
management.tracing.sampling.probability=1.0
