spring.application.name=seller-service
server.port=8011

# Một tài khoản chủ cơ sở dữ liệu vừa chạy migration vừa chạy dịch vụ (docs/service/seller-service/data.md mục 1). Cổng dev 5441
spring.datasource.url=jdbc:postgresql://localhost:5441/seller_db
spring.datasource.username=${SELLER_DB_USERNAME:seller_app}
spring.datasource.password=${SELLER_DB_PASSWORD:seller_app}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Chữ ký token kiểm trực tiếp qua khóa công khai của Xác thực, không qua cổng (như catalog-service)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8004/oauth2/jwks}

# Log yêu cầu: che nội dung định danh người bán (INV-SEL-11). Danh sách này THAY mặc định nên chép lại các mảnh mặc định
observability.logging.http.mask-contains=password,passwd,secret,token,authorization,apikey,api_key,credential,cardnumber,identitynumber,taxcode,address,legalname,representativename,contactname,personname,phone
management.tracing.sampling.probability=1.0

# Hibernate in thông báo gốc của Postgres, trong đó có dòng Detail chứa GIÁ TRỊ vi phạm (số căn cước, mã số thuế): tắt hai logger này
# để dữ liệu định danh không vào log (INV-SEL-11). Vi phạm ràng buộc đã được lớp trình bày ghi lại bằng mã lỗi, không bằng giá trị.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
